# Compile gate: default linux OSAL + liteos_a stub must both build.
# Public runners: host-cc (gcc) only. Self-hosted / local: lite/ci/build-osal-matrix.sh la64-osal
name: lite-osal-matrix
# Companion: .github/workflows/lite-qemu-ide.yml (soak ≥20 + smoke-qemu-edges; skips if no qemu).
on:
  push:
    branches: [ohjs/6.1-lite, 'ohjs/**']
    paths:
      - 'lite/osal/**'
      - 'lite/CMakeLists.txt'
      - 'lite/ci/**'
      - 'lite/docs/ide-error-codes.json'
      - 'lite/docs/ide-error-codes.schema.json'
      - 'lite/docs/BOARD-RECOVERY.md'
      - 'lite/docs/BOARD-CHECKLIST.md'
      - 'lite/docs/SOAK-FAILURE-ARCHIVE.md'
      - 'lite/docs/IDE-ERROR-CODES-FIELD-MAPPING.md'
      - 'lite/docs/IDE-ERROR-CODES-PIN-SYNC.md'
      - 'lite/docs/examples/**'
      - 'lite/tools/board/README-USB-GADGET.md'
      - 'lite/tools/board/usb-gadget-fsm.sh'
      - 'lite/tools/board/test-usb-gadget-fsm.sh'
      - 'lite/tools/board/setup-usb-gadget.sh'
      - 'lite/tools/board/check-board-recovery-refs.sh'
      - 'lite/toolchain/**'
      - '.github/workflows/lite-osal.yml'
  pull_request:
    paths:
      - 'lite/osal/**'
      - 'lite/CMakeLists.txt'
      - 'lite/ci/**'
      - 'lite/docs/ide-error-codes.json'
      - 'lite/docs/ide-error-codes.schema.json'
      - 'lite/docs/BOARD-RECOVERY.md'
      - 'lite/docs/BOARD-CHECKLIST.md'
      - 'lite/docs/SOAK-FAILURE-ARCHIVE.md'
      - 'lite/docs/IDE-ERROR-CODES-FIELD-MAPPING.md'
      - 'lite/docs/IDE-ERROR-CODES-PIN-SYNC.md'
      - 'lite/docs/examples/**'
      - 'lite/tools/board/README-USB-GADGET.md'
      - 'lite/tools/board/usb-gadget-fsm.sh'
      - 'lite/tools/board/test-usb-gadget-fsm.sh'
      - 'lite/tools/board/setup-usb-gadget.sh'
      - 'lite/tools/board/check-board-recovery-refs.sh'
      - 'lite/toolchain/**'
      - '.github/workflows/lite-osal.yml'
  workflow_dispatch:

jobs:
  host-cc-osal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OSAL matrix (host gcc) linux + liteos_a
        run: bash lite/ci/build-osal-matrix.sh host-cc

  ide-error-codes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lite docs regression oneshot
        run: bash lite/ci/run-lite-docs-regression.sh

  usb-gadget-fsm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FunctionFS FSM unit tests (incl. NEG/edge)
        run: bash lite/tools/board/test-usb-gadget-fsm.sh
